<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초대박 3종족 전략 보드게임 - 규칙 수정 버전</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2f3542;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        #status-panel {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            background: #1e222b;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .choice-btn {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #ff4757;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        .choice-btn:hover { background-color: #ff6b81; }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #1e222b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            user-select: none;
            cursor: pointer;
            position: relative;
        }

        .cell.highlight {
            box-shadow: inset 0 0 15px #2ed573;
            background-color: #2ed57344 !important;
        }
        .cell.move-valid {
            box-shadow: inset 0 0 15px #ffa500;
            background-color: #ffa50044 !important;
        }
        .cell.selected {
            background-color: #70a1ff !important;
        }

        .white { background-color: #f0d9b5; }
        .black { background-color: #b58863; }

        .piece {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .player-p { color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .player-e { color: #1e1e1e; text-shadow: 0 2px 5px rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div id="status-panel">
        <div id="status-text">게임을 시작하려면 당신의 종족을 선택하세요!</div>
        <div id="button-zone" class="btn-container">
            <button class="choice-btn" onclick="selectRace('Dragon')">🐉 Dragon</button>
            <button class="choice-btn" onclick="selectRace('Elf')">🧝 Elf</button>
            <button class="choice-btn" onclick="selectRace('Human')">👱 Human</button>
        </div>
    </div>

    <div class="chessboard" id="board"></div>

    <script>
        const board = document.getElementById('board');
        const statusText = document.getElementById('status-text');
        const buttonZone = document.getElementById('button-zone');

        const PIECE_DATABASE = {
            Dragon: {
                6: [{name:"화염 정령", emoji:"💥"}, {name:"용암 슬라임", emoji:"🍮"}, {name:"아기 와이번", emoji:"🦅"}],
                5: [{name:"새끼 용", emoji:"🦎"}, {name:"임프 파이터", emoji:"😈"}, {name:"가고일 정찰병", emoji:"🦇"}],
                4: [{name:"용암 전차", emoji:"🚗"}, {name:"맹독 전갈", emoji:"🦂"}, {name:"화염 살무사", emoji:"🐍"}],
                3: [{name:"마그마 거인", emoji:"☄️"}, {name:"메카 드래곤", emoji:"🤖"}, {name:"산성 와이번", emoji:"🧪"}],
                2: [{name:"화염 군주", emoji:"🔥"}, {name:"뇌전 폭룡", emoji:"⚡"}, {name:"폭풍 가고일", emoji:"🌪️"}],
                1: [{name:"파괴신 룡", emoji:"🌋"}, {name:"고대 신룡", emoji:"🐉"}, {name:"흑해 거룡", emoji:"🌌"}]
            },
            Elf: {
                6: [{name:"정령 나비", emoji:"🦋"}, {name:"엘프 민병대", emoji:"🏹"}, {name:"픽시", emoji:"✨"}],
                5: [{name:"드루이드", emoji:"🌿"}, {name:"엘프 검사", emoji:"⚔️"}, {name:"나무 정령", emoji:"🪵"}],
                4: [{name:"표범 조련사", emoji:"🐆"}, {name:"올빼미 정찰대", emoji:"🦉"}, {name:"페어리 도적", emoji:"🧚"}],
                3: [{name:"바람의 춤꾼", emoji:"🍃"}, {name:"환영술사", emoji:"🔮"}, {name:"켄타우로스", emoji:"🏹"}],
                2: [{name:"달빛 궁수", emoji:"🏹"}, {name:"그리핀 기사", emoji:"🦅"}, {name:"유니콘 수호수", emoji:"🦄"}],
                1: [{name:"엘프 여왕", emoji:"🧝‍♀️"}, {name:"세계수 수호자", emoji:"🌳"}, {name:"정령왕", emoji:"🧚‍♂️"}]
            },
            Human: {
                6: [{name:"보병", emoji:"💂"}, {name:"농민", emoji:"🧑‍🌾"}, {name:"훈련병", emoji:"🎖️"}],
                5: [{name:"견습 마법사", emoji:"🌟"}, {name:"창병", emoji:"🔱"}, {name:"스파이", emoji:"🕵️‍♂️"}],
                4: [{name:"그리핀 기수", emoji:"🦅"}, {name:"왕실 궁수", emoji:"🏹"}, {name:"석궁병", emoji:"🎯"}],
                3: [{name:"사제", emoji:"⛪"}, {name:"철벽 방패병", emoji:"🧱"}, {name:"십자군", emoji:"✝️"}],
                2: [{name:"중갑 기사", emoji:"🐴"}, {name:"왕실 암살자", emoji:"🗡️"}, {name:"대포 차", emoji:"💣"}],
                1: [{name:"성황 제왕", emoji:"👑"}, {name:"대마법사", emoji:"🧙‍♂️"}, {name:"성기사 단장", emoji:"🛡️"}]
            }
        };

        let gameState = "CHOOSE_RACE"; 
        let playerRace = "", enemyRace = "";
        let currentDraftTier = 6; 
        let playerSelectedPiece = null, enemySelectedPiece = null;
        let remainingPlacements = 0;
        let turn = "player"; 

        let boardState = Array(8).fill(null).map(() => Array(8).fill(null));
        let selectedCell = null; 
        let validMoves = [];     

        function createBoard() {
            board.innerHTML = "";
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    cell.dataset.row = row; cell.dataset.col = col;
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    board.appendChild(cell);
                }
            }
        }

        function selectRace(race) {
            playerRace = race;
            const races = ['Dragon', 'Elf', 'Human'];
            enemyRace = races.filter(r => r !== race)[Math.floor(Math.random() * 2)];
            gameState = "DRAFT_LOOP";
            startTierDraft();
        }

        function startTierDraft() {
            // 새 규칙에 맞춰 메시지에 표시할 총 배치 개수 연산
            let totalToPlace = 1;
            if (currentDraftTier === 6) totalToPlace = 8;
            else if (currentDraftTier === 5 || currentDraftTier === 4 || currentDraftTier === 3) totalToPlace = 2;

            statusText.innerHTML = `[나: ${playerRace} vs 적: ${enemyRace}]<br>${currentDraftTier}티어 기물을 선택하세요. (총 ${totalToPlace}개 배치)`;
            buttonZone.innerHTML = "";

            PIECE_DATABASE[playerRace][currentDraftTier].forEach(piece => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerHTML = `${piece.emoji} ${piece.name}`;
                btn.onclick = () => chooseDraftPiece(piece);
                buttonZone.appendChild(btn);
            });
        }

        function chooseDraftPiece(piece) {
            playerSelectedPiece = { ...piece, tier: currentDraftTier };
            
            // [수정 규칙 반영] 티어별 배치해야 하는 총 개수 지정
            if (currentDraftTier === 6) {
                remainingPlacements = 8;
            } else if (currentDraftTier === 5 || currentDraftTier === 4 || currentDraftTier === 3) {
                remainingPlacements = 2;
            } else {
                remainingPlacements = 1;
            }

            buttonZone.innerHTML = "";
            statusText.innerHTML = `내 진영(아래 2줄)에 ${piece.emoji}를 배치하세요. (남은 개수: ${remainingPlacements}개)`;

            const enemyChoices = PIECE_DATABASE[enemyRace][currentDraftTier];
            enemySelectedPiece = { ...enemyChoices[Math.floor(Math.random() * enemyChoices.length)], tier: currentDraftTier };

            highlightDraftZone(true);
        }

        function highlightDraftZone(on) {
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                if (on && (r === 6 || r === 7)) cell.classList.add('highlight');
                else cell.classList.remove('highlight');
            });
        }

        function handleCellClick(row, col) {
            if (gameState === "DRAFT_LOOP" && playerSelectedPiece) {
                if ((row === 6 || row === 7) && !boardState[row][col]) {
                    boardState[row][col] = { ...playerSelectedPiece, side: 'player' };
                    renderPieces();
                    remainingPlacements--;

                    aiPlaceEnemyPiece(); 

                    if (remainingPlacements > 0) {
                        statusText.innerHTML = `기물을 마저 배치하세요. (남은 개수: ${remainingPlacements}개)`;
                    } else {
                        highlightDraftZone(false);
                        playerSelectedPiece = null;
                        
                        if (currentDraftTier > 1) {
                            currentDraftTier--; 
                            startTierDraft();
                        } else {
                            gameState = "GAMEPLAY";
                            turn = "player";
                            statusText.innerHTML = "⚔️ 대전 시작! 내 기물을 클릭한 후, 주황색 이동 가능 칸으로 움직이세요.";
                        }
                    }
                }
            } 
            else if (gameState === "GAMEPLAY") {
                if (turn !== "player") return; 

                const clickedCellData = boardState[row][col];

                if (selectedCell && validMoves.some(m => m.r === row && m.c === col)) {
                    const from = selectedCell;
                    
                    boardState[row][col] = boardState[from.r][from.c];
                    boardState[from.r][from.c] = null;
                    
                    clearHighlights();
                    selectedCell = null;
                    renderPieces();

                    if (checkGameOver()) return;

                    turn = "enemy";
                    statusText.innerHTML = "🤖 컴퓨터가 생각 중입니다...";
                    setTimeout(enemyTurn, 1000);
                } 
                else if (clickedCellData && clickedCellData.side === 'player') {
                    clearHighlights();
                    selectedCell = { r: row, c: col };
                    document.querySelector(`[data-row='${row}'][data-col='${col}']`).classList.add('selected');
                    
                    validMoves = calculateMoves(row, col, clickedCellData);
                    validMoves.forEach(m => {
                        document.querySelector(`[data-row='${m.r}'][data-col='${m.c}']`).classList.add('move-valid');
                    });
                } else {
                    clearHighlights();
                    selectedCell = null;
                }
            }
        }

        function aiPlaceEnemyPiece() {
            let emptySpots = [];
            for (let r = 0; r <= 1; r++) {
                for (let c = 0; c < 8; c++) {
                    if (!boardState[r][c]) emptySpots.push({r, c});
                }
            }
            if (emptySpots.length > 0) {
                const spot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                boardState[spot.r][spot.c] = { ...enemySelectedPiece, side: 'enemy' };
                renderPieces();
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('selected', 'move-valid');
            });
        }

        function calculateMoves(row, col, piece) {
            const moves = [];
            const side = piece.side;
            const tier = piece.tier;

            const directions = [
                {r: -1, c: 0}, {r: 1, c: 0}, {r: 0, c: -1}, {r: 0, c: 1}, 
                {r: -1, c: -1}, {r: -1, c: 1}, {r: 1, c: -1}, {r: 1, c: 1}  
            ];

            let maxRange = 1;
            if (tier === 5) maxRange = 2;
            if (tier === 4) maxRange = 3;
            if (tier === 3) maxRange = 4;
            if (tier === 2) maxRange = 5;
            if (tier === 1) maxRange = 8; 

            directions.forEach(dir => {
                for (let i = 1; i <= maxRange; i++) {
                    const nr = row + dir.r * i;
                    const nc = col + dir.c * i;

                    if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break; 

                    const target = boardState[nr][nc];
                    if (!target) {
                        moves.push({ r: nr, c: nc });
                    } else {
                        if (target.side !== side) {
                            moves.push({ r: nr, c: nc });
                        }
                        break; 
                    }
                }
            });

            if (tier <= 3) {
                const knightOffsets = [
                    {r:-2, c:-1}, {r:-2, c:1}, {r:-1, c:-2}, {r:-1, c:2},
                    {r:1, c:-2}, {r:1, c:2}, {r:2, c:-1}, {r:2, c:1}
                ];
                knightOffsets.forEach(off => {
                    const nr = row + off.r;
                    const nc = col + off.c;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        const target = boardState[nr][nc];
                        if (!target || target.side !== side) {
                            moves.push({r: nr, c: nc});
                        }
                    }
                });
            }

            return moves;
        }

        function enemyTurn() {
            if (gameState !== "GAMEPLAY") return;

            let allEnemyMoves = [];

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = boardState[r][c];
                    if (piece && piece.side === 'enemy') {
                        const moves = calculateMoves(r, c, piece);
                        moves.forEach(m => {
                            let score = 1;
                            const target = boardState[m.r][m.c];
                            if (target && target.side === 'player') {
                                score = 10 + (6 - target.tier); 
                            }
                            allEnemyMoves.push({ from: {r, c}, to: m, score: score });
                        });
                    }
                }
            }

            if (allEnemyMoves.length > 0) {
                allEnemyMoves.sort((a, b) => b.score - a.score);
                const bestMove = allEnemyMoves[0];

                const from = bestMove.from;
                const to = bestMove.to;

                boardState[to.r][to.c] = boardState[from.r][from.c];
                boardState[from.r][from.c] = null;

                renderPieces();

                if (checkGameOver()) return;

                turn = "player";
                statusText.innerHTML = "⚔️ 내 턴입니다! 기물을 선택하여 움직이세요.";
            } else {
                endGame("플레이어 승리!");
            }
        }

        function checkGameOver() {
            let playerAlive = false;
            let enemyAlive = false;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c]) {
                        if (boardState[r][c].side === 'player') playerAlive = true;
                        if (boardState[r][c].side === 'enemy') enemyAlive = true;
                    }
                }
            }

            if (!playerAlive) { endGame("💀 컴퓨터(AI) 승리! 패배했습니다."); return true; }
            if (!enemyAlive) { endGame("🎉 축하합니다! 컴퓨터를 꺾고 승리하셨습니다!"); return true; }
            return false;
        }

        function endGame(message) {
            gameState = "GAME_OVER";
            statusText.innerHTML = `🏆 게임 종료: ${message}`;
            buttonZone.innerHTML = `<button class="choice-btn" onclick="location.reload()">다시 시작하기</button>`;
        }

        function renderPieces() {
            document.querySelectorAll('.piece').forEach(p => p.remove());
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const data = boardState[r][c];
                    if (data) {
                        const cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                        if (cell) {
                            const pieceEl = document.createElement('div');
                            pieceEl.className = `piece ${data.side === 'player' ? 'player-p' : 'player-e'}`;
                            pieceEl.textContent = data.emoji;
                            cell.appendChild(pieceEl);
                        }
                    }
                }
            }
        }

        createBoard();
    </script>
</body>
</html>
