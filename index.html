<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Faction Wars - AI Battle</title>

<style>
body {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#2f3542;
    margin:0;
    font-family:Arial;
    color:white;
}

#status-panel {
    margin-bottom:20px;
    font-size:18px;
    font-weight:bold;
    background:#1e222b;
    padding:15px 30px;
    border-radius:10px;
    max-width:600px;
    text-align:center;
}

.btn-container {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.choice-btn {
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#ff4757;
    color:white;
    font-weight:bold;
}
.choice-btn:hover { background:#ff6b81; }

.chessboard {
    display:grid;
    grid-template-columns:repeat(8,70px);
    grid-template-rows:repeat(8,70px);
    border:4px solid #1e222b;
}

.cell {
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    user-select:none;
    cursor:pointer;
}

.white { background:#f0d9b5; }
.black { background:#b58863; }

.cell.highlight {
    box-shadow: inset 0 0 15px #2ed573;
}

.cell.selected {
    background:#70a1ff !important;
}

.cell.move-valid {
    background:#ffa50055 !important;
}

.cell.enemy-move-valid {
    background:#ff475755 !important;
}

.piece {
    display:flex;
    width:100%;
    height:100%;
    justify-content:center;
    align-items:center;
}

/* =========================
   HELP BUTTON (FIXED)
========================= */

.help-box {
    position:fixed;
    right:20px;
    bottom:20px;
    background:#1e222b;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid #57606f;
}
.help-box:hover {
    border-color:#70a1ff;
}

.help-popup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1e222b;
    padding:25px;
    border-radius:15px;
    width:420px;
    max-width:90%;
    z-index:999;
}

.close-help {
    margin-top:15px;
    padding:8px 14px;
    border:none;
    background:#ff4757;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="status-panel">
    <div id="status-text">Loading...</div>
    <div id="button-zone" class="btn-container"></div>
</div>

<div class="chessboard" id="board"></div>

<div class="help-box" onclick="openHelp()">📖 How to Play</div>

<div class="help-popup" id="helpPopup">
    <h2>How to Play</h2>
    <p>
        1. Choose mode<br>
        2. Choose faction<br>
        3. Draft units<br>
        4. Place units<br>
        5. Win the battle
    </p>
    <button class="close-help" onclick="closeHelp()">Close</button>
</div>

<script>

/* =========================
   CORE STATE (원본 유지)
========================= */

const board = document.getElementById("board");
const statusText = document.getElementById("status-text");
const buttonZone = document.getElementById("button-zone");

let gameState = "MODE_SELECT";   // 🔥 추가
let mode = "";                  // 🔥 추가

let playerRace = "";
let enemyRace = "";

let currentDraftTier = 6;
let playerSelectedPiece = null;
let enemySelectedPiece = null;

let remainingPlacements = 0;
let turn = "player";

let boardState = Array(8).fill(null).map(()=>Array(8).fill(null));

let selectedCell = null;
let validMoves = [];

/* =========================
   PIECE DATABASE (원본 유지)
========================= */

const PIECE_DATABASE = {
    Dragon: {
        6: [{name:"Fire Spirit",emoji:"💥"},{name:"Magma Slime",emoji:"🍮"},{name:"Wyvern",emoji:"🦅"}],
        5: [{name:"Whelp",emoji:"🦎"}],
        4: [{name:"Lava Chariot",emoji:"🚗"}],
        3: [{name:"Magma Giant",emoji:"☄️"}],
        2: [{name:"Flame Lord",emoji:"🔥"}],
        1: [{name:"Ancient Dragon",emoji:"🐉"}]
    },
    Elf: {
        6: [{name:"Spirit",emoji:"🦋"}],
        5: [{name:"Druid",emoji:"🌿"}],
        4: [{name:"Beast Rider",emoji:"🐆"}],
        3: [{name:"Wind",emoji:"🍃"}],
        2: [{name:"Moon Archer",emoji:"🏹"}],
        1: [{name:"Elf Queen",emoji:"🧝‍♀️"}]
    },
    Human: {
        6: [{name:"Footman",emoji:"💂"}],
        5: [{name:"Mage",emoji:"🌟"}],
        4: [{name:"Rider",emoji:"🦅"}],
        3: [{name:"Priest",emoji:"⛪"}],
        2: [{name:"Knight",emoji:"🐴"}],
        1: [{name:"Emperor",emoji:"👑"}]
    }
};

/* =========================
   BOARD
========================= */

function createBoard(){
    board.innerHTML="";
    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){
            const cell=document.createElement("div");
            cell.className="cell "+((r+c)%2?"black":"white");
            cell.dataset.r=r;
            cell.dataset.c=c;
            cell.onclick=()=>handleCellClick(r,c);
            board.appendChild(cell);
        }
    }
}

/* =========================
   INIT + MODE SELECT (🔥 추가)
========================= */

function init(){
    createBoard();

    statusText.innerText="Choose Game Mode";

    buttonZone.innerHTML=`
        <button class="choice-btn" onclick="selectMode('VS COMPUTER')">🤖 VS Computer</button>
        <button class="choice-btn" onclick="selectMode('VS PLAYER')">👥 VS Player</button>
    `;
}

function selectMode(m){
    mode=m;
    gameState="CHOOSE_RACE";

    statusText.innerText="Choose Faction";

    buttonZone.innerHTML=`
        <button class="choice-btn" onclick="selectRace('Dragon')">🐉 Dragon</button>
        <button class="choice-btn" onclick="selectRace('Elf')">🧝 Elf</button>
        <button class="choice-btn" onclick="selectRace('Human')">👱 Human</button>
    `;
}

/* =========================
   RACE
========================= */

function selectRace(r){
    playerRace=r;
    const list=["Dragon","Elf","Human"].filter(x=>x!==r);
    enemyRace=list[Math.floor(Math.random()*2)];

    startDraft();
}

/* =========================
   DRAFT (원본 유지)
========================= */

function startDraft(){
    gameState="DRAFT_LOOP";

    statusText.innerHTML=
    `[${mode}]<br>${playerRace} vs ${enemyRace}<br>Tier ${currentDraftTier}`;

    buttonZone.innerHTML="";

    PIECE_DATABASE[playerRace][currentDraftTier].forEach(p=>{
        const b=document.createElement("button");
        b.className="choice-btn";
        b.innerText=p.emoji+" "+p.name;
        b.onclick=()=>selectPiece(p);
        buttonZone.appendChild(b);
    });
}

function selectPiece(piece){
    playerSelectedPiece={...piece,tier:currentDraftTier};

    remainingPlacements =
        currentDraftTier===6 ? 8 :
        currentDraftTier<=3 ? 2 : 1;

    buttonZone.innerHTML="";
    highlightZone(true);
}

/* =========================
   PLACE
========================= */

function highlightZone(on){
    document.querySelectorAll(".cell").forEach(c=>{
        const r=+c.dataset.r;
        if(on && (r===6||r===7)) c.classList.add("highlight");
        else c.classList.remove("highlight");
    });
}

/* =========================
   CLICK (원본 유지 구조)
========================= */

function handleCellClick(r,c){

    if(gameState==="DRAFT_LOOP" && playerSelectedPiece){

        if((r===6||r===7) && !boardState[r][c]){

            boardState[r][c]={...playerSelectedPiece,side:"player"};
            remainingPlacements--;

            aiPlaceEnemyPiece();
            render();

            if(remainingPlacements<=0){
                currentDraftTier--;

                if(currentDraftTier<1){
                    gameState="GAMEPLAY";
                    statusText.innerText="Battle Start!";
                    return;
                }

                startDraft();
            }
        }
        return;
    }

    if(gameState==="GAMEPLAY"){

        const cell=boardState[r][c];

        if(cell){
            selectedCell={r,c};
        } else if(selectedCell){
            boardState[r][c]=boardState[selectedCell.r][selectedCell.c];
            boardState[selectedCell.r][selectedCell.c]=null;
            selectedCell=null;
            render();
        }
    }
}

/* =========================
   AI (원본 유지)
========================= */

function aiPlaceEnemyPiece(){

    let spots=[];

    for(let r=0;r<=1;r++){
        for(let c=0;c<8;c++){
            if(!boardState[r][c]) spots.push({r,c});
        }
    }

    if(spots.length){
        const s=spots[Math.floor(Math.random()*spots.length)];
        boardState[s.r][s.c]={...playerSelectedPiece,side:"enemy"};
    }
}

/* =========================
   RENDER
========================= */

function render(){

    document.querySelectorAll(".piece").forEach(p=>p.remove());

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            const d=boardState[r][c];

            if(d){
                const cell=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
                const p=document.createElement("div");
                p.className="piece";
                p.innerText=d.emoji;
                cell.appendChild(p);
            }
        }
    }
}

/* =========================
   HELP (UI만 변경)
========================= */

function openHelp(){
    document.getElementById("helpPopup").style.display="block";
}

function closeHelp(){
    document.getElementById("helpPopup").style.display="none";
}

/* START */
init();

</script>

</body>
</html>
